name: Keep Render Instance Alive

on:
    schedule:
        - cron: "*/1 * * * *"

    workflow_dispatch:

jobs:
    ping:
        runs-on: ubuntu-latest

        steps:
            - name: Ping Render Health Endpoint
              run: |
                  curl --silent --show-error --fail \
                  https://rr-tours-front.onrender.com/health
